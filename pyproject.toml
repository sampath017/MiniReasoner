[project]
name = "mini-reasoner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-storage-blob>=12.24,<13",
    "datasets>=3,<5",
    "mlflow>=3.7,<4",
    "numpy>=1.26,<3",
    "rclone-bin==1.76.0; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "tokenizers>=0.20,<1",
    "torch>=2.4,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "notebook>=7.6.5",
    "python-dotenv>=1.2.4",
]
